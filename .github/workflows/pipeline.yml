name: Pipeline

# CI를 하나의 파이프라인으로 통합한 워크플로.
# - secret-scan / lint / codeql: 서로 의존성 없음 → 병렬 실행
# - impact-analysis: 위 3개가 모두 통과해야 실행 (self-hosted runner 필요)
#
# 성능 벤치마크(perf 라벨 / 수동 실행 / 주간 스케줄)는 benchmark.yml로 분리되어 있다.
# 여기에 `labeled` 트리거를 다시 넣으면 안 된다: 라벨이 붙는 순간 labeled 이벤트로
# 이 워크플로가 다시 돌고, 아래 job들이 `if` 조건에 걸려 skip되면서 그 skip 결과가
# required status check(secret-scan/lint/codeql)의 최신 상태를 덮어써 PR이 영구히
# 머지 불가 상태가 된다. Dependabot이 dependencies 라벨을 붙이는 PR에서 실제로
# 발생했다 (PR #17~#22).
#
# 자동 배포(deploy) job은 의도적으로 없습니다. 개발 디렉토리와 실행 중인
# 서비스 디렉토리가 동일(C:\local_LLM)해서 별도 "배포 대상"이 존재하지
# 않고, GitHub push는 버전 관리/아카이브 목적입니다. main이 바뀌면
# 수동으로 git pull + restart.bat을 실행하세요.
#
# self-hosted 의존 job(impact-analysis, performance)은 등록된 러너가
# 없으면 대기만 하고 실행되지 않습니다.
# 필요한 리포지토리 시크릿: BIFROST_BASE_URL, BIFROST_API_KEY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * 1" # CodeQL 주간 스캔 (매주 월요일 03:00 UTC)

jobs:
  # ---- 병렬 실행: 서로 의존성 없음 ----

  secret-scan:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/

  codeql:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: ["python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ---- secret-scan/lint/codeql 통과 후에만 실행 ----

  impact-analysis:
    if: github.event_name == 'pull_request'
    needs: [secret-scan, lint, codeql]
    runs-on: self-hosted
    defaults:
      run:
        # AllSigned(LocalMachine)에 막히는 GitHub 임시 래퍼 스크립트를
        # 이 job의 run: 스텝에서만 우회한다 (머신 전체 정책은 그대로 둠).
        # requests는 C:\local_LLM\venv에 이미 설치되어 있어 actions/setup-python +
        # pip install 없이 그 venv의 python.exe를 직접 사용한다 (setup-python의
        # 내부 setup.ps1도 같은 AllSigned 정책에 막히므로 아예 쓰지 않음).
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run impact analysis
        env:
          # 한국어 Windows 러너에서 Python stdout/stderr이 cp949로 인코딩되면
          # Actions의 UTF-8 로그 캡처와 어긋나 한글이 깨진다. 특히 실패 경로
          # (impact_analysis.py의 sys.stderr 출력)는 OS/네트워크 예외 메시지가
          # 한글로 나오므로, 정작 원인을 봐야 할 때 로그가 깨진다.
          PYTHONIOENCODING: utf-8
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BIFROST_BASE_URL: ${{ secrets.BIFROST_BASE_URL }}
          BIFROST_API_KEY: ${{ secrets.BIFROST_API_KEY }}
        run: |
          & "C:\local_LLM\venv\Scripts\python.exe" scripts\impact_analysis.py
