name: Pipeline

# CI/CD를 하나의 파이프라인으로 통합한 워크플로.
# - secret-scan / lint / codeql: 서로 의존성 없음 → 병렬 실행
# - impact-analysis: 위 3개가 모두 통과해야 실행 (self-hosted runner 필요)
# - deploy: 위 3개가 모두 통과해야 실행 (main push 시, self-hosted runner 필요)
# - performance: 위 체인과 무관 (perf 라벨/수동 실행/주간 스케줄로만 독립 실행)
#
# self-hosted 의존 job(impact-analysis, deploy, performance)은 등록된 러너가
# 없으면 대기만 하고 실행되지 않습니다.
# 필요한 리포지토리 시크릿: BIFROST_BASE_URL, BIFROST_API_KEY, DISCORD_WEBHOOK_URL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1" # CodeQL 주간 스캔 (매주 월요일 03:00 UTC)
    - cron: "0 4 * * 1" # 성능 벤치마크 주간 실행 (매주 월요일 04:00 UTC)

jobs:
  # ---- 병렬 실행: 서로 의존성 없음 ----

  secret-scan:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/

  codeql:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: ["python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"

  # ---- secret-scan/lint/codeql 통과 후에만 실행 ----

  impact-analysis:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    needs: [secret-scan, lint, codeql]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run impact analysis
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIFROST_BASE_URL: ${{ secrets.BIFROST_BASE_URL }}
          BIFROST_API_KEY: ${{ secrets.BIFROST_API_KEY }}
        run: python scripts/impact_analysis.py

  deploy:
    if: github.event_name == 'push'
    needs: [secret-scan, lint, codeql]
    runs-on: self-hosted
    steps:
      - name: Run deploy script
        shell: powershell
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          & "C:\local_LLM\scripts\deploy_update.ps1"

  # ---- 독립 실행: perf 라벨 / 수동 실행 / 주간 스케줄 ----

  performance:
    if: >
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'perf') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run benchmark
        env:
          BIFROST_BASE_URL: ${{ secrets.BIFROST_BASE_URL }}
          BIFROST_API_KEY: ${{ secrets.BIFROST_API_KEY }}
        run: python scripts/benchmark_bifrost.py
