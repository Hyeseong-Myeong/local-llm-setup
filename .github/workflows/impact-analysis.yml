name: AI Impact Analysis

# 주의: Bifrost 게이트웨이는 Tailscale 사설망(로컬 PC)에서만 접근 가능하므로,
# 이 워크플로는 해당 네트워크에 등록된 self-hosted runner가 있어야 실행됩니다.
# 등록된 러너가 없으면 이 job은 큐에서 대기만 하고 실행되지 않습니다.
# 필요한 리포지토리 시크릿: BIFROST_BASE_URL, BIFROST_API_KEY

on:
  pull_request:
    branches: [main]

jobs:
  impact-analysis:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run impact analysis
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIFROST_BASE_URL: ${{ secrets.BIFROST_BASE_URL }}
          BIFROST_API_KEY: ${{ secrets.BIFROST_API_KEY }}
        run: python scripts/impact_analysis.py
