# [보관] 이 파일은 더 이상 사용되지 않는다 — 2026-08-22 archive/ 로 이동.
#
# Bifrost v1.6+ 는 YAML 설정 파일을 읽지 않고 내부 SQLite(config.db)로만 구동된다.
# 실제 배포도 docker-compose 에서 ./data:/app/data 만 마운트하며 이 파일은
# 컨테이너에 전달되지 않는다. 즉 여기 적힌 providers/models 는 실행에 아무
# 영향이 없다. 실제 설정은 bifrost/data/config.db 이며 Web UI 로 관리한다.
#
# 설계 근거: Docs/LLM_system_extend_loadmap.md 의 2026-07-15 설계 변경 기록.
# 남겨 두는 이유: 초기 라우팅 의도(어느 모델을 어느 프로바이더에 매핑했는지)의
# 기록으로서 가치가 있다. 근거 자료로 인용하지 말 것 — 현행 설정이 아니다.

providers:
  ollama:
    type: ollama
    base_url: "http://host.docker.internal:11434"
  gemini:
    type: gemini
    api_key: "${GEMINI_API_KEY}"
  groq:
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
  cerebras:
    type: openai
    base_url: "https://api.cerebras.ai/v1"
    api_key: "${CEREBRAS_API_KEY}"
  mistral:
    type: mistral
    api_key: "${MISTRAL_API_KEY}"
  anthropic:
    type: anthropic
    api_key: "${ANTHROPIC_API_KEY}"

models:
  # Base Local
  qwen3.5:9b:
    provider: ollama
    model: qwen3.5:9b
  # Coder Local
  qwen2.5-coder:7b:
    provider: ollama
    model: qwen2.5-coder:7b
  # Vision Local
  gemma4:e4b:
    provider: ollama
    model: gemma4:e4b
  # Embedding Local
  bge-m3:
    provider: ollama
    model: bge-m3
  # RAG Fallback Local
  exaone3.5:7.8b:
    provider: ollama
    model: exaone3.5:7.8b
  # Interview Local
  deepseek-r1:14b:
    provider: ollama
    model: deepseek-r1:14b
  # Cloud
  gemini-1.5-pro:
    provider: gemini
    model: gemini-1.5-pro-latest
  gemini-1.5-flash:
    provider: gemini
    model: gemini-1.5-flash-latest
  llama3-70b-8192:
    provider: groq
    model: llama3-70b-8192
  llama3.1-70b:
    provider: cerebras
    model: llama-3.1-70b
  codestral-latest:
    provider: mistral
    model: codestral-latest
  claude-3-5-sonnet-20240620:
    provider: anthropic
    model: claude-3-5-sonnet-20240620

virtual_keys:
  - id: vk_desktop_main
    name: "Desktop Main Key"
    description: "Main key for local development and agents"
    provider_configs:
      - provider: ollama
        allowed_models: ["*"]
      - provider: gemini
        allowed_models: ["*"]
      - provider: groq
        allowed_models: ["*"]
      - provider: cerebras
        allowed_models: ["*"]
      - provider: mistral
        allowed_models: ["*"]
      - provider: anthropic
        allowed_models: ["*"]

tracing:
  service_name: "bifrost-gateway"
  collector_url: "${LANGFUSE_BASE_URL}/api/public/otel/v1/traces"
  trace_type: "genai_extension"
  protocol: "http"
  headers:
    Authorization: "Basic ${LANGFUSE_AUTH_B64}"
