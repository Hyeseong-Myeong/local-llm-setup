# Open WebUI — LLM 호출을 Bifrost 게이트웨이로 보낸다.
#
# 이전에는 docker run 으로 띄우고 Ollama(11434)를 직접 불렀다. 게이트웨이를 거치면
# 클라우드 모델도 함께 쓸 수 있고 관측·인증이 한 곳으로 모인다.
# 대가: Bifrost 가 죽으면 Open WebUI 도 모델 목록을 잃는다.
#
# 실행 (반드시 저장소 루트에서, --env-file 을 명시할 것):
#   docker compose --env-file .env -f open-webui/docker-compose.yml up -d
# compose 는 .env 를 "실행한 디렉터리" 기준으로 읽으므로 --env-file 이 없으면
# BIFROST_API_KEY 가 빈 값이 되어 인증이 조용히 깨진다.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      # 기존 동작(전 인터페이스)을 유지한다. 특정 인터페이스로 좁히려면
      # .env 에 OPEN_WEBUI_BIND_IP 를 지정한다 (bifrost 와 같은 방식).
      - "${OPEN_WEBUI_BIND_IP:-0.0.0.0}:3000:8080"
    logging:
      # syslog 드라이버 -> 개발 PC Alloy (설계 4-2). dual-logging 이라 `docker logs` 는
      # 그대로 유지된다. 로컬 유닉스 syslog 포맷이 기본값이다(syslog-format 미지정).
      # host.docker.internal 이어야 한다 — Docker Desktop 이 dockerd 를 WSL2 VM
      # 안에서 돌리므로 127.0.0.1 은 그 VM 자신의 루프백이라 Windows 호스트에
      # 닿지 않는다(monitoring/devpc/config.alloy 참조, 실측 확인).
      driver: syslog
      options:
        syslog-address: "udp://host.docker.internal:51400"
        tag: "{{.Name}}"
        mode: "non-blocking"
        max-buffer-size: "4m"
    volumes:
      # docker run 시절부터 쓰던 볼륨을 그대로 재사용한다. 대화 기록이 여기 있다.
      - open-webui:/app/backend/data
    environment:
      # Ollama 직접 경로를 끈다 — 모든 호출이 게이트웨이를 지나게 하는 것이 목적이다.
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://host.docker.internal:18080/v1
      - OPENAI_API_KEY=${BIFROST_API_KEY}
      - ANONYMIZED_TELEMETRY=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  open-webui:
    external: true
