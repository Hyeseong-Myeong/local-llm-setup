# 심각도 라벨(severity)로 3개 Discord 채널에 나눠 보낸다 (9장).
# group_wait/repeat_interval 을 등급별로 다르게 둔다 — 크리티컬은 빨리·자주,
# info 는 묶어서 하루 한 번(9-2: "🟢 등급은 일간 요약으로 묶는다").
apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-warning
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord-critical
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

      - receiver: discord-warning
        object_matchers:
          - ["severity", "=", "warning"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        continue: false

      - receiver: discord-info
        object_matchers:
          - ["severity", "=", "info"]
        group_by: ["alertname"]
        group_wait: 1m
        group_interval: 24h
        repeat_interval: 24h
        continue: false
