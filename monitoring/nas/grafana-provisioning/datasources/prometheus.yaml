# Grafana 가 기동하면서 Prometheus 데이터소스를 자동 등록한다.
#
# Prometheus 는 network_mode: host 라 브리지 네트워크의 Grafana 가 서비스 이름
# DNS(예: prometheus:9090)로 못 닿는다 — loki.yaml 과 달리 tailnet IP 를 직접
# 써야 한다. 4번에서 Prometheus 에 tailnet 바인딩을 추가하면서 이미 검증했다:
# `docker exec grafana wget -qO- http://$TAILNET_BIND_IP:13090/-/healthy` 성공.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-nas
    type: prometheus
    access: proxy
    url: http://$TAILNET_BIND_IP:13090
    isDefault: false
    editable: false
