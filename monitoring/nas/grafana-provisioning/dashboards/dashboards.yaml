# Grafana 가 기동하면서 이 디렉터리의 JSON 대시보드를 자동 등록한다 (구축 순서 8번).
apiVersion: 1

providers:
  - name: PLG Monitoring
    orgId: 1
    folder: PLG Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
