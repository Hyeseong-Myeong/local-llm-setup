version: '3.8'

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost
    ports:
      # 호스트 포트는 18080을 쓴다. 8080을 피하는 이유:
      # 이 기기에서 Windows NAT Driver(winnat)가 8000번대에 100포트 단위 블록을
      # 예약한다 (netsh interface ipv4 show excludedportrange protocol=tcp).
      # 8080이 예약 블록(예: 8037-8136)에 걸리면 바인딩이 거부되면서
      # "socket in a way forbidden by its access permissions" 에러가 나고,
      # 컨테이너는 healthy인데 포트 매핑만 조용히 사라져 로컬/원격 모두 끊긴다.
      #
      # 주의 — 예약 구간은 고정이 아니다. winnat 을 멈추면 100포트 블록이 전부
      # 사라지고, 서비스를 다시 켜도 곧바로 돌아오지는 않았다(2026-08-22 실측).
      # 즉 "지금 8080이 비어 있다"는 것은 근거가 되지 못한다 — 재부팅 후 다시
      # 잡힐 수 있으므로 예약 대상이 되지 않는 대역을 쓰는 편이 안전하다.
      # (초기 주석에 있던 "동적 포트 범위가 1024~15000이라서"라는 설명은 오진이었다.
      #  재측정 결과 동적 포트 범위는 Windows 기본값 49152/16384였고, 예약 블록은
      #  그보다 아래에 잡힌다. 자세한 경위는 Docs/troubleshooting.md 섹션 14 참조.)
      #
      # 컨테이너 내부 포트(8080)는 Bifrost가 서빙하는 포트이므로 그대로 둔다.
      # 루프백(로컬 스크립트/CI용)은 항상 고정으로 열어둔다.
      - "127.0.0.1:18080:8080"
      # Tailscale 등 다른 인터페이스는 .env(커밋되지 않음)의 BIFROST_BIND_IP로 추가.
      # 주의: BIFROST_BIND_IP를 127.0.0.1로 두거나 비워두면 위 줄과 완전히 동일한
      # 매핑이 중복 등록되어 "port is already allocated" 에러가 난다 — 반드시
      # 127.0.0.1이 아닌 실제 다른 인터페이스 IP(이 기기의 Tailscale IP 등)로 설정할 것.
      # Docker 포트 매핑은 "어느 인터페이스에 열지"만 제어하며 특정 원격 IP만
      # 허용하는 화이트리스트가 아니므로, 접근 기기를 제한하려면 Tailscale ACL이나
      # OS 방화벽을 별도로 설정해야 한다.
      - "${BIFROST_BIND_IP:-127.0.0.1}:18080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      - LANGFUSE_AUTH_B64=${LANGFUSE_AUTH_B64}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
